services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban_inteligente_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban_dev_password
      POSTGRES_DB: kanban_inteligente
    ports:
      - "5432:5432"
    volumes:
      - kanban_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban_inteligente"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kanban_pg_data:
